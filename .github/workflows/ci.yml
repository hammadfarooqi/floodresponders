name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n tools/coord && tools/coord_smoke.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: test -f web/package.json && echo "yes=1" >> "$GITHUB_OUTPUT" || echo "web/ not scaffolded yet, skipping"
      - if: steps.has.outputs.yes
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.has.outputs.yes
        working-directory: web
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dir: [api, agent]
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: test -f ${{ matrix.dir }}/requirements.txt && echo "yes=1" >> "$GITHUB_OUTPUT" || echo "${{ matrix.dir }}/ not scaffolded yet, skipping"
      - if: steps.has.outputs.yes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*/requirements.txt"
      - if: steps.has.outputs.yes
        working-directory: ${{ matrix.dir }}
        run: |
          pip install -r requirements.txt ruff pytest
          ruff check .
          pytest
