[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rollcall-agent"
version = "0.1.0"
description = "Deep Agents integration for Roll Call"
requires-python = ">=3.12"
dependencies = ["deepagents==0.7.38", "langchain-core>=1.8,<2", "langsmith>=0.14.17,<1"]

[project.optional-dependencies]
local-speech = ["vosk==0.3.45"]

[tool.setuptools.packages.find]
include = ["rollcall_agent*"]

[tool.setuptools.package-data]
rollcall_agent = ["manager_dispatch_demo.html", "call_chat.html"]
